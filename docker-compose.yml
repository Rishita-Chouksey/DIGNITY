services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dignity
      POSTGRES_USER: dignity
      POSTGRES_PASSWORD: dignity
    # Use 5433 on the host to avoid colliding with a separately installed PostgreSQL service.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/migrations:/docker-entrypoint-initdb.d:ro"]
volumes:
  pgdata:
